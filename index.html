<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OEMS Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <small>OEMS · PRACTICAL TOOLS</small>
    <h1>Tool Library</h1>
    <p>Search every OEMS tool, or pick a category below.</p>
    <input id="search" type="search" placeholder="Search tools (e.g. noise dose, laser, SPCC)" autofocus>
    <div id="count"></div>
  </div>
</header>
<div class="wrap">
  <section class="groups" id="groups"></section>
  <main id="results" hidden>
    <div id="list"></div>
    <p id="none">No tools match. <button id="clear">Clear search</button></p>
  </main>
</div>
<script src="tools.js"></script>
<script src="groups.js"></script>
<script>
  const search = document.getElementById('search');
  const count = document.getElementById('count');

  document.getElementById('groups').innerHTML = Object.entries(GROUPS).map(([key, g]) => {
    const c = g.colors;
    const n = TOOLS.filter(t => t.group === key).length;
    return '<a class="gcard" style="background:' + c.bg + '" href="library.html?g=' + g.slug + '">' +
      '<div class="tag" style="color:' + c.tag + '">' + esc(g.tag) + '</div>' +
      '<h2><span>' + esc(g.title[0]) + '</span><span style="color:' + c.line2 + '">' + esc(g.title[1]) + '</span></h2>' +
      '<div class="art" aria-hidden="true">' + g.art + '</div>' +
      '<p style="color:' + c.text + '">' + esc(g.blurb) + '</p>' +
      '<div class="go"><span style="color:' + c.text + '">' + n + ' tools</span><span style="color:' + c.tag + '">Browse tools →</span></div>' +
      '</a>';
  }).join('');

  function render() {
    const q = search.value.trim();
    document.getElementById('groups').hidden = !!q;
    document.getElementById('results').hidden = !q;
    if (!q) { count.textContent = TOOLS.length + ' tools'; return; }
    const found = TOOLS.filter(t => matches(t, q));
    document.getElementById('list').innerHTML = found.map(t => toolRow(t, true)).join('');
    document.getElementById('none').style.display = found.length ? 'none' : 'block';
    count.textContent = found.length + ' of ' + TOOLS.length + ' tools';
  }

  search.addEventListener('input', render);
  document.getElementById('clear').addEventListener('click', () => { search.value = ''; render(); search.focus(); });
  render();
</script>
</body>
</html>
