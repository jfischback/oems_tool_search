<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Practical calculators for industrial hygiene, environmental compliance and workplace safety, built by OEMS.">
<meta name="theme-color" content="#070d18">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OEMS Tools">
<meta property="og:title" content="OEMS Tools">
<meta property="og:description" content="Practical calculators for industrial hygiene, environmental compliance and workplace safety, built by OEMS.">
<meta property="og:image" content="https://oemstoolsearch.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://oemstoolsearch.vercel.app/og.png">
<script defer src="/_vercel/insights/script.js"></script>
<title>OEMS Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fields.css">
</head>
<body>
<header class="fh">
  <div class="wrap">
    <nav class="nav">
      <div class="navl">
        <a class="brand" href="index.html"><i></i>OEMS</a>
        <div class="crumb"><a href="index.html">Tools</a> &nbsp;/&nbsp; <a id="fieldlink"></a> &nbsp;/&nbsp; <b id="crumb"></b></div>
      </div>
      <a class="home" href="https://www.oemsgroup.com">oemsgroup.com ↗</a>
    </nav>
    <div class="hero-in tight">
      <div>
        <div class="pill"><i></i><span id="pill"></span></div>
        <h1 id="title" class="th1"></h1>
        <p class="lede" id="blurb"></p>
        <div class="sbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off">
        </div>
        <div id="count"></div>
      </div>
      <div class="bigic" id="bigic" aria-hidden="true"></div>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="secs"></div>
  <details class="indiv" id="indiv"></details>
  <nav class="stepnav" id="stepnav"></nav>
  <p id="none">No tools match. <button id="clear">Clear search</button></p>
</div>
<footer>Built by OEMS · Occupational Exposure Management Systems</footer>
<script src="tools.js"></script>
<script src="groups.js"></script>
<script src="topics.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const key = Object.keys(GROUPS).find(k => GROUPS[k].slug === params.get('g')) || 'IH';
  const g = GROUPS[key], th = g.theme;
  const fieldName = key === 'IH' ? 'Industrial Hygiene' : key;
  const cats = [...new Set(TOOLS.filter(t => t.group === key).map(t => t.category))];
  const steps = (typeof STEPS !== 'undefined' && STEPS[key]) || [];
  const stepIdx = steps.findIndex(st => st.slug === params.get('s'));
  const step = stepIdx >= 0 ? steps[stepIdx] : null;
  let cat = step ? null : cats.find(c => topicSlug(c) === params.get('t'));
  if (!step && !cat) { location.replace('library.html?g=' + g.slug); cat = cats[0]; }
  const info = cat ? ((TOPICS[key] || {})[cat] || {}) : {};
  const search = document.getElementById('search');

  // groups: [label, tools, eyebrow]
  const groups = [];
  if (step) {
    stepSections(key, step).forEach(x => groups.push([x.name, x.tools, x.eyebrow]));
  } else {
    const all = TOOLS.filter(t => t.group === key && t.category === cat);
    if (info.subs) {
      const placed = new Set();
      for (const [name, names] of Object.entries(info.subs)) {
        const list = names.map(n => all.find(t => t.name === n)).filter(Boolean);
        list.forEach(t => placed.add(t.name));
        if (list.length) groups.push([name, list, '']);
      }
      const rest = all.filter(t => !placed.has(t.name));
      if (rest.length) groups.push(['More tools', rest, '']);
    } else groups.push(['', all, '']);
  }
  const tools = groups.flatMap(x => x[1]);
  const pageName = step ? step.name : cat;

  const root = document.documentElement.style;
  Object.entries(th).forEach(([k, v]) => root.setProperty('--' + k, v));
  root.setProperty('--grid', th.tag + '12');

  document.title = 'OEMS ' + (step ? fieldName + ': ' + step.name : cat + ' Tools');
  const fl = document.getElementById('fieldlink'); fl.textContent = fieldName; fl.href = 'library.html?g=' + g.slug;
  document.getElementById('crumb').textContent = pageName;
  const mainTools = tools.filter(t => !isTucked(t));
  const live = mainTools.filter(t => t.url).length;
  document.getElementById('pill').textContent = (step ? 'Step ' + (stepIdx + 1) + ' of ' + steps.length + ' · ' : '') + mainTools.length + ' tool' + (mainTools.length === 1 ? '' : 's') + (live < mainTools.length ? ' · ' + (mainTools.length - live) + ' coming soon' : '');
  document.getElementById('title').innerHTML = esc(pageName) + '<span>' + esc(fieldName) + '</span>';
  document.getElementById('blurb').textContent = step ? step.blurb : (info.blurb || g.blurb);
  document.getElementById('bigic').innerHTML = step ? '<span class="bignum">' + String(stepIdx + 1).padStart(2, '0') + '</span>' : icon(cat, th.tag);
  search.placeholder = 'Search ' + pageName.toLowerCase() + ' tools…';

  // Previous / next step
  if (step) {
    const prev = steps[stepIdx - 1], next = steps[stepIdx + 1];
    const link = (st, dir) => st ? '<a class="' + dir + '" href="topic.html?g=' + g.slug + '&s=' + st.slug + '"><small>' + (dir === 'prev' ? '← Previous' : 'Next →') + '</small><strong>' + esc(st.name) + '</strong></a>' : '<span></span>';
    document.getElementById('stepnav').innerHTML = link(prev, 'prev') + link(next, 'next');
  }

  function clip(s, n) { return s.length > n ? s.slice(0, n - 3).trim() + '…' : s; }
  function tile(t) {
    return t.url
      ? '<a class="tile" href="' + esc(t.url) + '"><h3>' + esc(t.name) + featuredBadge(t) + '</h3><p>' + esc(clip(t.description, 110)) + '</p><span>Open →</span></a>'
      : '<div class="tile soon"><h3>' + esc(t.name) + '</h3><p>' + esc(clip(t.description, 110)) + '</p><span>Coming soon</span></div>';
  }
  function irow(t) {
    return '<a class="irow" href="' + esc(t.url) + '"><strong>' + esc(t.name) + '</strong><small>Also in ' + esc(COVERED_BY[t.name]) + '</small><span>Open →</span></a>';
  }
  const section = (label, list, eyebrow) => '<section class="sec">' + (eyebrow ? '<div class="sublabel">' + esc(eyebrow) + '</div>' : '') +
    '<div class="sechead"><h2>' + esc(label || 'Tools') + '</h2><em>' + list.length + ' tool' + (list.length === 1 ? '' : 's') + '</em></div>' +
    '<div class="grid">' + list.map(tile).join('') + '</div></section>';

  function render() {
    const q = search.value.trim();
    const ind = document.getElementById('indiv');
    if (q) {
      const found = rank(tools.filter(t => matches(t, q)), q);
      document.getElementById('secs').innerHTML = found.length ? '<section class="sec"><div class="grid">' + found.map(tile).join('') + '</div></section>' : '';
      ind.hidden = true;
      document.getElementById('none').style.display = found.length ? 'none' : 'block';
      document.getElementById('count').textContent = found.length + ' of ' + tools.length + ' tools';
      return;
    }
    document.getElementById('none').style.display = 'none';
    document.getElementById('count').textContent = '';
    document.getElementById('secs').innerHTML = groups.map(([name, list, eyebrow]) => {
      const main = rank(list.filter(t => !isTucked(t)), '');
      if (!main.length) return '';
      return name ? section(name, main, eyebrow) : '<section class="sec"><div class="grid">' + main.map(tile).join('') + '</div></section>';
    }).join('');
    const tucked = tools.filter(isTucked);
    ind.hidden = !tucked.length;
    if (tucked.length) {
      const wasOpen = ind.open;
      ind.innerHTML = '<summary><div><h2>Individual calculators</h2><p>' + tucked.length + ' single-equation calculators. Each one is also part of a bigger tool above.</p></div><span class="chev"><span class="o">Show ↓</span><span class="c">Hide ↑</span></span></summary>' +
        '<div class="ilist">' + groups.map(([name, list, eyebrow]) => {
          const t2 = list.filter(isTucked);
          return t2.length ? (name ? '<h4>' + esc((eyebrow ? eyebrow + ' · ' : '') + name) + '</h4>' : '') + t2.map(irow).join('') : '';
        }).join('') + '</div>';
      ind.open = wasOpen;
    }
  }

  search.addEventListener('input', render);
  document.getElementById('clear').addEventListener('click', () => { search.value = ''; render(); search.focus(); });
  render();
</script>
</body>
</html>
