<title>OEMS Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<!-- 24 Nov 2026, Jonathan: the main site's white OEMS header, so Tools feels like part of the site -->
<header class="site-header">
  <div class="wrap header-inner">
    <a class="sh-brand" href="https://oemswebsite.vercel.app/" aria-label="OEMS home"><img src="oems-logo.webp" alt="OEMS — Occupational Exposure Management Systems" width="1109" height="417"></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav"><span class="sr-only">Menu</span><span class="nb" aria-hidden="true"></span></button>
    <nav id="site-nav" class="site-nav" aria-label="Main"><ul><li><a href="https://oemswebsite.vercel.app/services">Services</a></li><li><a href="index.html" aria-current="page">Tools</a></li><li><a href="https://oemswebsite.vercel.app/about">About</a></li><li><a href="https://oemswebsite.vercel.app/contact">Contact</a></li></ul></nav>
  </div>
</header>
<header class="fh">
  <div class="wrap">
    <nav class="nav">
      <div class="navl">
        <div class="crumb"><a href="index.html">Tools</a> &nbsp;/&nbsp; <a id="fieldlink"></a> &nbsp;/&nbsp; <b id="crumb"></b></div>
      </div>
    </nav>
    <div class="hero-in tight">
      <div>
        <div class="pill" id="pillwrap"><i></i><span id="pill"></span></div>
        <div class="stepper" id="stepper" hidden></div>
        <h1 id="title" class="th1"></h1>
        <p class="lede" id="blurb"></p>
        <div class="sbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off">
        </div>
        <div id="count"></div>
      </div>
      <div class="bigic" id="bigic" aria-hidden="true"></div>
    </div>
  </div>
</header>
<div class="wrap">
  <a class="guided" id="guided" hidden></a>
  <section class="bigsec" id="bigsec" hidden><div class="eyebrow" id="bigeye"></div><h2 id="bigtitle"></h2><div class="bgrid" id="bgrid"></div></section>
  <div id="secs"></div>
  <details class="indiv" id="indiv"></details>
  <nav class="stepnav" id="stepnav"></nav>
  <p id="none">No tools match. <button id="clear">Clear search</button></p>
</div>
<!-- 24 Nov 2026, Jonathan: the same footer as the main site -->
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-id"><a class="footer-brand" href="https://oemswebsite.vercel.app/"><strong>OEMS</strong> <span>Occupational Exposure Management Systems</span></a><p class="footer-slogan">We help companies turn data into decisions.</p></div>
    <nav aria-label="Footer"><ul><li><a href="https://oemswebsite.vercel.app/services">Services</a></li><li><a href="index.html">Tools</a></li><li><a href="https://oemswebsite.vercel.app/about">About</a></li><li><a href="https://oemswebsite.vercel.app/contact">Contact</a></li></ul></nav>
  </div>
</footer>
<script src="tools.js"></script>
<script src="groups.js"></script>
<script src="topics.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const key = Object.keys(GROUPS).find(k => GROUPS[k].slug === params.get('g')) || 'IH';
  const g = GROUPS[key], th = g.theme;
  const fieldName = key === 'IH' ? 'Industrial Hygiene' : key === 'OH' ? 'Occupational Health' : key;
  const cats = [...new Set(TOOLS.filter(t => t.group === key).map(t => t.category))];
  const steps = (typeof STEPS !== 'undefined' && STEPS[key]) || [];
  const stepIdx = steps.findIndex(st => st.slug === params.get('s'));
  const step = stepIdx >= 0 ? steps[stepIdx] : null;
  const programs = (typeof PROGRAMS !== 'undefined' && PROGRAMS[key]) || [];
  const program = step ? null : programs.find(pr => pr.slug === params.get('p'));
  let cat = step ? null : (program ? program.topic : cats.find(c => topicSlug(c) === params.get('t')));
  if (!step && !cat) { location.replace('library.html?g=' + g.slug); cat = cats[0]; }
  const info = cat ? ((TOPICS[key] || {})[cat] || {}) : {};
  const search = document.getElementById('search');

  // groups: [label, tools, eyebrow]
  const groups = [];
  if (step) {
    stepSections(key, step).forEach(x => groups.push([x.name, x.tools, x.eyebrow]));
  } else {
    const all = TOOLS.filter(t => t.group === key && t.category === cat);
    if (program && (program.assess || program.control)) {
      const pick = names => (names || []).map(n => all.find(x => x.name === n)).filter(Boolean);
      const a = pick(program.assess), c = pick(program.control);
      const used = new Set([...a, ...c].map(x => x.name));
      if (a.length) groups.push(['Assess', a, '']);
      if (c.length) groups.push(['Control', c, '']);
      const rest = all.filter(x => !used.has(x.name));
      if (rest.length) groups.push(['Other ' + cat.toLowerCase() + ' tools', rest, '']);
    } else if (info.subs) {
      const placed = new Set();
      for (const [name, names] of Object.entries(info.subs)) {
        const list = names.map(n => all.find(t => t.name === n)).filter(Boolean);
        list.forEach(t => placed.add(t.name));
        if (list.length) groups.push([name, list, '']);
      }
      const rest = all.filter(t => !placed.has(t.name));
      if (rest.length) groups.push(['More tools', rest, '']);
    } else groups.push(['', all, '']);
  }
  const tools = groups.flatMap(x => x[1]);
  const pageName = step ? step.name : (program ? program.name : cat);

  const root = document.documentElement.style;
  Object.entries(th).forEach(([k, v]) => root.setProperty('--' + k, v));
  root.setProperty('--grid', th.tag + '12');
  // 24 Nov 2026 (Jonathan): technical topic pages get the dark blue tool header, whatever the field.
  const blue = GROUPS.IH.theme;
  for (const k of ['hero', 'glow', 'tag', 'line2']) root.setProperty('--hero-' + k, blue[k]);
  document.querySelector('header.fh').classList.add('fh-blue');

  document.title = 'OEMS ' + (step ? fieldName + ': ' + step.name : pageName + (program ? '' : ' Tools'));
  const fl = document.getElementById('fieldlink'); fl.textContent = fieldName; fl.href = 'library.html?g=' + g.slug;
  document.getElementById('crumb').textContent = pageName;
  const mainTools = tools.filter(t => !isTucked(t));
  const live = mainTools.filter(t => t.url).length;
  document.getElementById('pill').textContent = (program && program.combined) ? tools.length + ' noise tools' : (step ? 'Step ' + (stepIdx + 1) + ' of ' + steps.length + ' · ' : '') + mainTools.length + ' tool' + (mainTools.length === 1 ? '' : 's') + (live < mainTools.length ? ' · ' + (mainTools.length - live) + ' coming soon' : '');
  document.getElementById('title').textContent = pageName; // one-line title on technical pages (24 Nov 2026)
  document.getElementById('blurb').textContent = step ? step.blurb : (program ? program.blurb : (info.blurb || g.blurb));
  document.getElementById('bigic').innerHTML = step ? stepIcon(step.slug, th.tag) : icon(cat, th.tag);
  if (step) {
    const flow = steps.filter(st => !st.rest);
    const sp = document.getElementById('stepper'); sp.hidden = false;
    sp.innerHTML = flow.map((st, i) => '<a class="' + (st.slug === step.slug ? 'on' : (flow.indexOf(step) > i ? 'done' : '')) + '" href="topic.html?g=' + g.slug + '&s=' + st.slug + '"><span>' + (i + 1) + '</span>' + esc(st.name) + '</a>').join('<i></i>') +
      '<em></em><a class="' + (step.rest ? 'on ref' : 'ref') + '" href="topic.html?g=' + g.slug + '&s=tools">Tools</a>';
    document.getElementById('pillwrap').hidden = true;
  }
  search.placeholder = 'Search ' + pageName.toLowerCase() + ' tools…';

  // Previous / next step
  if (step) {
    const prev = steps[stepIdx - 1], next = steps[stepIdx + 1];
    const link = (st, dir) => st ? '<a class="' + dir + '" href="topic.html?g=' + g.slug + '&s=' + st.slug + '"><small>' + (dir === 'prev' ? '← Previous' : 'Next →') + '</small><strong>' + esc(st.name) + '</strong></a>' : '<span></span>';
    document.getElementById('stepnav').innerHTML = link(prev, 'prev') + link(next, 'next');
  }

  function clip(s, n) { return s.length > n ? s.slice(0, n - 3).trim() + '…' : s; }
  function tile(t) {
    return t.url
      ? '<a class="tile" href="' + esc(t.url) + '"><h3>' + esc(t.name) + featuredBadge(t) + '</h3><p>' + esc(clip(t.description, 110)) + '</p><span>Open →</span></a>'
      : '<div class="tile soon"><h3>' + esc(t.name) + '</h3><p>' + esc(clip(t.description, 110)) + '</p><span>Coming soon</span></div>';
  }
  function irow(t) {
    if (!t.url) return '<div class="irow"><strong>' + esc(t.name) + '</strong><small></small><span style="color:#8a97ab">Coming soon</span></div>';
    const sm = COVERED_BY[t.name] ? 'Also in ' + COVERED_BY[t.name] : (t.description.length > 70 ? t.description.slice(0, 67) + '…' : t.description);
    return '<a class="irow" href="' + esc(t.url) + '"><strong>' + esc(t.name) + '</strong><small>' + esc(sm) + '</small><span>Open →</span></a>';
  }
  const section = (label, list, eyebrow) => '<section class="sec">' + (eyebrow ? '<div class="sublabel">' + esc(eyebrow) + '</div>' : '') +
    '<div class="sechead"><h2>' + esc(label || 'Tools') + '</h2><em>' + list.length + ' tool' + (list.length === 1 ? '' : 's') + '</em></div>' +
    '<div class="grid">' + list.map(tile).join('') + '</div></section>';

  // Big cards: the Assess page's "pick your assessment" cards, or a program's featured tools
  const bigSec = document.getElementById('bigsec');
  const cardsOnly = !!(step && step.cards);
  if (cardsOnly) {
    document.getElementById('bigeye').textContent = 'Pick your assessment';
    document.getElementById('bigtitle').textContent = 'What are you assessing?';
    document.getElementById('bgrid').classList.toggle('two', step.cards.length === 2);
    document.getElementById('bgrid').classList.toggle('one', step.cards.length === 1);
    document.getElementById('bgrid').innerHTML = step.cards.map(cd => bigCard(cd.tool ? TOOLS.find(t => t.name === cd.tool) : null, Object.assign({ cta: 'Start assessment' }, cd), th)).join('');
  } else if (program && program.combined) {
    const gt = TOOLS.find(x => x.name === program.guided);
    if (gt && gt.url) { const gl = document.getElementById('guided'); gl.hidden = false; gl.href = gt.url; gl.innerHTML = '<span>Doing a full noise exposure assessment?</span><b>Start the guided assessment <i>→</i></b>'; }
    document.getElementById('bigeye').textContent = 'Featured';
    document.getElementById('bigtitle').textContent = 'Combined tools';
    const combos = TOOLS.filter(x => x.group === key && x.category === cat && isCombined(x) && x.url && x.name !== program.guided);
    document.getElementById('bgrid').innerHTML = combos.map(x => bigCard(x, { cta: 'Open tool' }, th)).join('');
  } else if (program) {
    document.getElementById('bigeye').textContent = 'Featured';
    document.getElementById('bigtitle').textContent = 'Start here';
    document.getElementById('bgrid').innerHTML = program.featured.map(n => bigCard(TOOLS.find(t => t.name === n), { cta: 'Open tool' }, th)).join('');
  }
  const hasBig = cardsOnly || !!program;

  function render() {
    const q = search.value.trim();
    const ind = document.getElementById('indiv');
    bigSec.hidden = !hasBig || !!q;
    document.getElementById('guided').style.display = q ? 'none' : '';
    if (q) {
      const found = rank(tools.filter(t => matches(t, q)), q);
      document.getElementById('secs').innerHTML = found.length ? '<section class="sec"><div class="grid">' + found.map(tile).join('') + '</div></section>' : '';
      ind.hidden = true;
      document.getElementById('none').style.display = found.length ? 'none' : 'block';
      document.getElementById('count').textContent = found.length + ' of ' + tools.length + ' tools';
      return;
    }
    document.getElementById('none').style.display = 'none';
    document.getElementById('count').textContent = '';
    if (cardsOnly) { document.getElementById('secs').innerHTML = ''; document.getElementById('indiv').hidden = true; return; }
    if (program && program.combined) {
      document.getElementById('secs').innerHTML = '';
      const singles = groups.map(([name, list]) => [name, list.filter(x => !(isCombined(x) && x.url) && x.name !== program.guided)]).filter(x => x[1].length);
      const n = singles.reduce((a, x) => a + x[1].length, 0);
      const wasOpen = ind.open; ind.hidden = false;
      ind.innerHTML = '<summary><div><h2>Single calculators</h2><p>' + n + ' one-job calculators, grouped by topic.</p></div><span class="chev"><span class="o">Show ↓</span><span class="c">Hide ↑</span></span></summary>' +
        '<div class="ilist">' + singles.map(([name, list]) => (name ? '<h4>' + esc(name) + '</h4>' : '') + list.map(irow).join('')).join('') + '</div>';
      ind.open = wasOpen;
      return;
    }
    document.getElementById('secs').innerHTML = (program ? '<div class="allhead"><div class="eyebrow">Everything in this program</div><h2>All tools</h2></div>' : '') + groups.map(([name, list, eyebrow]) => {
      const main = rank(list.filter(t => !isTucked(t)), '');
      if (!main.length) return '';
      return name ? section(name, main, eyebrow) : '<section class="sec"><div class="grid">' + main.map(tile).join('') + '</div></section>';
    }).join('');
    const tucked = tools.filter(isTucked);
    ind.hidden = !tucked.length;
    if (tucked.length) {
      const wasOpen = ind.open;
      ind.innerHTML = '<summary><div><h2>Individual calculators</h2><p>' + tucked.length + ' single-equation calculators. Each one is also part of a bigger tool above.</p></div><span class="chev"><span class="o">Show ↓</span><span class="c">Hide ↑</span></span></summary>' +
        '<div class="ilist">' + groups.map(([name, list, eyebrow]) => {
          const t2 = list.filter(isTucked);
          return t2.length ? (name ? '<h4>' + esc((eyebrow ? eyebrow + ' · ' : '') + name) + '</h4>' : '') + t2.map(irow).join('') : '';
        }).join('') + '</div>';
      ind.open = wasOpen;
    }
  }

  search.addEventListener('input', render);
  document.getElementById('clear').addEventListener('click', () => { search.value = ''; render(); search.focus(); });
  render();
</script>
<script src="oems-header.js"></script>
</body>
</html>
